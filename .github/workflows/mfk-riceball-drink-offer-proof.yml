name: mfk-riceball-drink-offer-proof
# rerun after canonical drink mapping test update
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  proof:
    if: github.head_ref == 'work/MFK/SMT-RICEBALL-DRINK-PROMO-R1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Admin
        working-directory: v2admin
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Admin tests
        working-directory: v2admin
        run: npm run test
      - name: Admin build
        working-directory: v2admin
        run: npm run build
      - name: Install SMT
        working-directory: v2local
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: SMT tests
        working-directory: v2local
        run: npm run test
      - name: SMT build
        working-directory: v2local
        run: npm run build
      - name: Protected authority seams
        shell: bash
        run: |
          set -euo pipefail
          grep -F "localRuntime.createOrder(orderInput)" v2local/src/runtime/keeta-order-intake.ts
          grep -F "buildOrderPrintPlan" v2local/src/runtime/local-runtime.ts
          grep -F "providerRef===providerRef" v2local/src/runtime/local-runtime.ts
          grep -F "pricingPromotions" v2admin/src/admin-config-save.ts
          grep -F "MFK_RICEBALL_DRINK_PROMOTION_V1" v2local/src/runtime/admin-config-projection.ts
      - name: Diff check
        run: git diff --check origin/main...HEAD
