name: admin-media-cloudflare-audit-r1

on:
  push:
    branches:
      - work/MFK/ADMIN-PRODUCT-MEDIA-BACKEND-R1
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admin worker secret names
        working-directory: v2admin
        run: npx --yes wrangler@latest secret list --name mfk-admin
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: D1 resources
        working-directory: v2admin
        run: npx --yes wrangler@latest d1 list
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: R2 resources
        working-directory: v2admin
        run: npx --yes wrangler@latest r2 bucket list
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
