name: v3admin-ui-preview
# Navigation acceptance refresh: contextual back control

on:
  push:
    branches:
      - feat/MFK-V3ADMIN-ONE-SHOT-R1
    paths:
      - 'v3admin/**'
      - '.github/workflows/v3admin-ui-preview.yml'
  pull_request:
    branches:
      - feat/MFK-V3ADMIN-ONE-SHOT-R1
    paths:
      - 'v3admin/**'
      - '.github/workflows/v3admin-ui-preview.yml'

permissions:
  contents: read

concurrency:
  group: mfk-v3admin-ui-preview
  cancel-in-progress: true

jobs:
  publish-ui-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3admin
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROJECT_NAME: mfk-admin-v3-ui-preview
      PREVIEW_BRANCH: preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run typecheck

      - name: Build isolated V3 UI preview
        run: npm run build
        env:
          MFK_SOURCE_SHA: ${{ github.sha }}
          MFK_V3ADMIN_RELEASE_ID: preview-${{ github.sha }}
          VITE_MFK_V3_PREVIEW_MODE: '1'
          VITE_MFK_V3_R2_MEDIA_ENABLED: '0'

      - name: Keep R2 integration code deferred
        shell: bash
        run: |
          set -euo pipefail
          if [ -f wrangler.jsonc ]; then
            mv wrangler.jsonc wrangler.r2.deferred.jsonc
          fi
          if [ -d functions ]; then
            mv functions functions.r2.deferred
          fi
          echo "R2 product-media entry remains in source but is intentionally not deployed before Owner Admin acceptance."

      - name: Ensure preview project exists
        shell: bash
        run: |
          set +e
          npx --yes wrangler@latest pages project create "$PROJECT_NAME" --production-branch preview >/tmp/pages-create.log 2>&1
          code=$?
          set -e
          cat /tmp/pages-create.log
          if [ "$code" -ne 0 ]; then
            echo "Project create returned non-zero; continuing because it may already exist."
          fi

      - name: Publish UI-only Admin implementation preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy dist \
            --project-name "$PROJECT_NAME" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "MFK Admin V3 implementation preview — R2 deferred"

      - name: Public preview readback
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const expected=process.env.GITHUB_SHA;
          const base='https://mfk-admin-v3-ui-preview.pages.dev';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          let last='';
          for(let attempt=1;attempt<=18;attempt++){
            try{
              const [release,html]=await Promise.all([
                fetch(base+'/release.json',{headers:{'cache-control':'no-cache'}}).then(r=>r.json()),
                fetch(base+'/?preview=ui-01',{headers:{'cache-control':'no-cache'}}).then(r=>r.text()),
              ]);
              if(release?.sourceSha===expected&&html.includes('MFK Admin V3')){
                console.log('PREVIEW_GREEN '+base+'/');
                console.log('SOURCE_SHA '+release.sourceSha);
                console.log('R2_MEDIA_PHASE DEFERRED_UNTIL_OWNER_ADMIN_ACCEPTANCE');
                process.exit(0);
              }
              last=JSON.stringify({release,htmlTitle:html.slice(0,120)});
            }catch(error){last=String(error);}
            await sleep(5000);
          }
          console.error('Preview readback failed: '+last);
          process.exit(1);
          NODE
