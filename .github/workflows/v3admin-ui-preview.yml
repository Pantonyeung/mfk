name: v3admin-ui-preview

on:
  push:
    branches:
      - feat/MFK-V3ADMIN-ONE-SHOT-R1
    paths:
      - 'v3admin/**'
      - '.github/workflows/v3admin-ui-preview.yml'

permissions:
  contents: read

concurrency:
  group: mfk-v3admin-ui-preview
  cancel-in-progress: true

jobs:
  publish-ui-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3admin
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROJECT_NAME: mfk-admin-v3-ui-preview
      PREVIEW_BRANCH: preview
      PRODUCT_MEDIA_BUCKET: mfk-admin-v3-product-media-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run typecheck

      - name: Best-effort preview R2 bucket create
        shell: bash
        run: |
          set +e
          npx --yes wrangler@latest r2 bucket create "$PRODUCT_MEDIA_BUCKET" >/tmp/r2-create.log 2>&1
          code=$?
          set -e
          cat /tmp/r2-create.log
          if [ "$code" -ne 0 ]; then
            echo "::warning::Current deploy token cannot create R2 buckets. Pages deploy will verify whether the preview bucket already exists and is bindable."
          fi

      - name: Build isolated V3 UI preview
        run: npm run build
        env:
          MFK_SOURCE_SHA: ${{ github.sha }}
          MFK_V3ADMIN_RELEASE_ID: preview-${{ github.sha }}
          VITE_MFK_V3_PREVIEW_MODE: '1'

      - name: Ensure preview project exists
        shell: bash
        run: |
          set +e
          npx --yes wrangler@latest pages project create "$PROJECT_NAME" --production-branch preview >/tmp/pages-create.log 2>&1
          code=$?
          set -e
          cat /tmp/pages-create.log
          if [ "$code" -ne 0 ]; then
            echo "Project create returned non-zero; continuing because it may already exist."
          fi

      - name: Publish Pages preview with R2 binding and Functions
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy dist             --config wrangler.pages.jsonc             --project-name "$PROJECT_NAME"             --branch "$PREVIEW_BRANCH"             --commit-hash "$GITHUB_SHA"             --commit-message "MFK Admin V3 public implementation preview"

      - name: Public preview and R2 binding readback
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const expected=process.env.GITHUB_SHA;
          const base='https://mfk-admin-v3-ui-preview.pages.dev';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          let last='';
          for(let attempt=1;attempt<=18;attempt++){
            try{
              const [release,health,html]=await Promise.all([
                fetch(base+'/release.json',{headers:{'cache-control':'no-cache'}}).then(r=>r.json()),
                fetch(base+'/api/preview-health',{headers:{'cache-control':'no-cache'}}).then(async r=>({status:r.status,body:await r.json()})),
                fetch(base+'/?preview=ui-01',{headers:{'cache-control':'no-cache'}}).then(r=>r.text()),
              ]);
              if(release?.sourceSha===expected&&health.status===200&&health.body?.storage==='R2_ONLY'&&html.includes('MFK Admin V3')){
                console.log('PREVIEW_GREEN '+base+'/');
                console.log('R2_BINDING_GREEN '+JSON.stringify(health.body));
                console.log('SOURCE_SHA '+release.sourceSha);
                process.exit(0);
              }
              last=JSON.stringify({release,health,htmlTitle:html.slice(0,120)});
            }catch(error){last=String(error);}
            await sleep(5000);
          }
          console.error('Preview/R2 readback failed: '+last);
          process.exit(1);
          NODE
