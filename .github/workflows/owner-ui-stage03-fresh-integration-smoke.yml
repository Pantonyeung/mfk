name: owner-ui-stage03-fresh-integration-smoke

on:
  push:
    branches:
      - work/MFK/OWNER-UI-STAGE03-FRESH-INTEGRATION-R1
  workflow_dispatch:

jobs:
  owner-ui-stage03-fresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2owner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
