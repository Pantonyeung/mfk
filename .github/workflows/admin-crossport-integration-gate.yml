name: admin-crossport-integration-gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'v2admin/**'
      - 'contracts/**'
      - 'integrations/keeta/**'
      - '.github/workflows/admin-crossport-integration-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keeta-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/keeta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keeta contract tests
        run: npm test
      - name: Keeta contract build
        run: npm run build

  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Full Admin tests
        run: npm test
      - name: Admin build
        run: npm run build
      - name: Admin Wrangler dry-run
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc

  v2local:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Full v2local tests
        run: npm test
      - name: v2local build
        run: npm run build

  smm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2smm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Full SMM tests
        run: npm test
      - name: SMM build
        run: npm run build
      - name: SMM Wrangler dry-run
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
