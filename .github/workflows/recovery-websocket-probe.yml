name: recovery-websocket-probe

on:
  push:
    branches:
      - recovery/live-readback-5ff4eea2-r1
    paths:
      - '.github/workflows/recovery-websocket-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      WEB_ACCEPTANCE_TOKEN: ${{ secrets.WEB_ACCEPTANCE_TOKEN }}
    steps:
      - name: Probe public SMT HTTP and WebSocket
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent ws@8
          node <<'NODE'
          const crypto=require('node:crypto');
          const WebSocket=require('ws');
          const host='mfk-smt-web.yeungyi88.workers.dev';
          const token=process.env.WEB_ACCEPTANCE_TOKEN||'';
          console.log(JSON.stringify({secretPresent:Boolean(token)}));
          const proof=token?crypto.createHash('sha256').update('MFK-SMT-WEB-ACCEPTANCE:'+token).digest('hex'):'';
          const cookie=proof?'mfk_smt_web_acceptance_session='+proof:'';
          const http=await fetch('https://'+host+'/__mfk/health',{headers:cookie?{cookie}:{}}).catch(e=>null);
          if(http){
            console.log(JSON.stringify({httpStatus:http.status,httpBody:(await http.text()).slice(0,500)}));
          }else console.log(JSON.stringify({httpStatus:0}));
          await new Promise(resolve=>{
            const ws=new WebSocket('wss://'+host+'/__mfk/admin/api/admin-sync/events?storeId=MF01',{headers:cookie?{Cookie:cookie}:{}});
            const timer=setTimeout(()=>{console.log(JSON.stringify({ws:'TIMEOUT'}));try{ws.terminate()}catch{};resolve()},8000);
            ws.on('open',()=>console.log(JSON.stringify({ws:'OPEN'})));
            ws.on('message',data=>{console.log(JSON.stringify({ws:'MESSAGE',data:String(data).slice(0,1000)}));clearTimeout(timer);ws.close();resolve()});
            ws.on('unexpected-response',(_req,res)=>{console.log(JSON.stringify({ws:'UNEXPECTED_RESPONSE',status:res.statusCode,headers:res.headers}));clearTimeout(timer);resolve()});
            ws.on('error',error=>{console.log(JSON.stringify({ws:'ERROR',error:String(error)}));});
            ws.on('close',(code,reason)=>{console.log(JSON.stringify({ws:'CLOSE',code,reason:String(reason)}));});
          });
          NODE
