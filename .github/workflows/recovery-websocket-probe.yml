name: recovery-websocket-probe

on:
  push:
    branches:
      - recovery/live-readback-5ff4eea2-r1
    paths:
      - '.github/workflows/recovery-websocket-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe direct Admin WebSocket and public acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent ws@8
          node <<'NODE'
          const WebSocket=require('ws');
          async function probe(url,headers={}){
            return await new Promise(resolve=>{
              const out={url};
              const ws=new WebSocket(url,{headers});
              const timer=setTimeout(()=>{out.result='TIMEOUT';try{ws.terminate()}catch{};resolve(out)},8000);
              ws.on('open',()=>{out.open=true});
              ws.on('message',data=>{out.result='MESSAGE';out.data=String(data).slice(0,1000);clearTimeout(timer);ws.close();resolve(out)});
              ws.on('unexpected-response',(_req,res)=>{out.result='HTTP_'+res.statusCode;out.headers=res.headers;clearTimeout(timer);resolve(out)});
              ws.on('error',error=>{out.error=String(error)});
              ws.on('close',(code,reason)=>{out.close={code,reason:String(reason)}});
            });
          }
          (async()=>{
            const direct=await probe('wss://admin.morefunos.com/api/admin-sync/events?storeId=MF01');
            console.log(JSON.stringify({probe:'direct-admin',...direct}));
            const publicProbe=await probe('wss://mfk-smt-web.yeungyi88.workers.dev/__mfk/admin/api/admin-sync/events?storeId=MF01');
            console.log(JSON.stringify({probe:'public-no-cookie',...publicProbe}));
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
