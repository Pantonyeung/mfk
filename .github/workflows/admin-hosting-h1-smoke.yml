name: admin-hosting-h1-smoke

on:
  push:
    branches:
      - work/MFK/ADMIN-HOSTING-H1-R1
  workflow_dispatch:

jobs:
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
      - name: Wrangler static hosting dry run
        run: npx --yes wrangler@latest deploy --dry-run --outdir=/tmp/mfk-admin-h1
