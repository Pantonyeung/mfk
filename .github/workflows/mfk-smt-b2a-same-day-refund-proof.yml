name: mfk-smt-b2a-same-day-refund-proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  proof:
    if: github.head_ref == 'work/MFK/SMT-B2A-SAME-DAY-REFUND-R1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install SMT
        working-directory: v2local
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: SMT tests
        working-directory: v2local
        run: npm run test
      - name: SMT build
        working-directory: v2local
        run: npm run build
      - name: Protected seams
        shell: bash
        run: |
          set -euo pipefail
          grep -F "REFUND_ADMIN_REQUIRED_CLOSED_DAY" v2local/src/runtime/local-runtime.ts
          grep -F "PROVIDER_REFUND_USE_AFTERSALE" v2local/src/runtime/local-runtime.ts
          grep -F "refundOrder(orderId,input)" v2local/src/runtime/local-runtime.ts
          grep -F "cancelOrder(orderId,reason)" v2local/src/runtime/local-runtime.ts
          grep -F "cashRefundMinor" v2local/src/runtime/local-operations.ts
          grep -F "退款方式" v2local/src/runtime/daily-close-ticket.ts
          grep -F "跨日／已完成日結嘅退款" v2local/src/presentation/RuntimeOrdersWorkspace.tsx
      - name: Diff check
        run: git diff --check origin/main...HEAD
