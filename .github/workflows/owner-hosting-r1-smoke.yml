name: owner-hosting-r1-smoke

on:
  push:
    branches:
      - work/MFK/OWNER-HOSTING-R1
  pull_request:
    paths:
      - 'v2owner/**'
      - '.github/workflows/owner-hosting-r1-smoke.yml'
  workflow_dispatch:

jobs:
  owner-hosting:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
      - name: Wrangler dry-run
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
