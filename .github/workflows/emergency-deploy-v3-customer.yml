name: emergency-deploy-v3-customer

on:
  push:
    branches:
      - work/MFP-V3-CUSTOMER-DEPLOY-2026-10-03
    paths:
      - .github/v3-emergency/customer.trigger

permissions:
  contents: read

concurrency:
  group: mfk-v3-customer-production
  cancel-in-progress: false

jobs:
  deploy-customer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_BRANCH: work/MFP-V3-CUSTOMER-DEPLOY-2026-10-03
      RELEASE_TARGET: customer
      EXPECTED_SERVICE: mfk-customer
      EXPECTED_HOST: order.morefunos.com
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MFK_SOURCE_SHA: ${{ github.sha }}
      MFP_SOURCE_SHA: ${{ github.sha }}
      VITE_MFK_V3_CONFIG_WRITES_ENABLED: '0'
      VITE_MFK_V3_PREVIEW_MODE: '0'
      VITE_MFK_V3_R2_MEDIA_ENABLED: '0'
      VITE_MFK_ADMIN_API_BASE: ''
      VITE_MFK_V3_PREVIEW_API_BASE: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact pushed source and current remote branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Pantonyeung/mfk"
          test "$GITHUB_REF" = "refs/heads/$RELEASE_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module <<'NODE'
          const branch = process.env.RELEASE_BRANCH;
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/${branch}`, {
            headers: {
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
            redirect: 'error',
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error(`REMOTE_BRANCH_READ_FAILED_${response.status}`);
          const body = await response.json();
          if (body?.object?.type !== 'commit' || body.object.sha !== process.env.GITHUB_SHA) {
            throw new Error('REMOTE_BRANCH_SHA_MISMATCH');
          }
          console.log('EXACT_SOURCE_VERIFIED');
          NODE

      - name: Install exact release tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/v3-release-tools" --no-save --package-lock=false --no-audit --no-fund wrangler@4.146.0
          node -e "const p=require(process.env.RUNNER_TEMP+'/v3-release-tools/node_modules/wrangler/package.json'); if(p.version!=='4.146.0') process.exit(1); console.log('WRANGLER_VERSION_VERIFIED')"

      - name: Build and test Customer V3
        shell: bash
        run: |
          set -euo pipefail
          (
            cd v3customer
            npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
            npm run typecheck
            node --test test/acceptance-cutover.checks.mjs
            npm run build
          )
          git diff --quiet HEAD -- .
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const identity = JSON.parse(await readFile('v3customer/dist/customer-build-identity.json', 'utf8'));
          if (identity?.surface !== 'MFP_CUSTOMER_V3' || identity.sourceCommit !== process.env.GITHUB_SHA || identity.sourceDirty !== false) {
            throw new Error('CUSTOMER_BUILD_IDENTITY_MISMATCH');
          }
          console.log(`CUSTOMER_BUILD_IDENTITY_VERIFIED ${identity.sourceCommit}`);
          NODE

      - name: Verify existing Customer service metadata before deployment
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${process.env.EXPECTED_SERVICE}`;
          async function cf(path) {
            const response = await fetch(base + path, {
              headers: {authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, accept: 'application/json'},
              redirect: 'error',
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`CLOUDFLARE_READ_FAILED_${response.status}_${path.replaceAll('/', '_')}`);
            const body = await response.json();
            if (body?.success !== true) throw new Error('CLOUDFLARE_RESPONSE_INVALID');
            return body.result;
          }
          const settings = await cf('/settings');
          const bindings = Array.isArray(settings?.bindings) ? settings.bindings : [];
          const safe = bindings.map(({name, type, bucket_name}) => ({name, type, ...(bucket_name ? {bucket_name} : {})}));
          const expected = [
            {name: 'ASSETS', type: 'assets'},
            {name: 'CUSTOMER_ASSETS', type: 'r2_bucket', bucket_name: 'mfk-customer-assets'},
          ];
          const canonical = value => JSON.stringify(value, Object.keys(value).sort());
          const sort = rows => rows.map(row => ({...row})).sort((a, b) => canonical(a).localeCompare(canonical(b)));
          if (JSON.stringify(sort(safe)) !== JSON.stringify(sort(expected))) throw new Error('CUSTOMER_BINDINGS_MISMATCH');
          const result = await cf('/deployments?page=1&per_page=1');
          const deployment = result?.deployments?.[0];
          const version = deployment?.versions?.[0];
          if (!deployment?.id || deployment.versions?.length !== 1 || version?.percentage !== 100 || typeof version.version_id !== 'string') {
            throw new Error('CUSTOMER_ACTIVE_DEPLOYMENT_INVALID');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `deployment_id=${deployment.id}\npre_version=${version.version_id}\n`);
          console.log(`CUSTOMER_PREFLIGHT_VERIFIED deployment=${deployment.id} version=${version.version_id}`);
          NODE

      - name: Deploy Customer V3 with sanitized Wrangler diagnostics
        id: wrangler
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          WRANGLER="$RUNNER_TEMP/v3-release-tools/node_modules/wrangler/bin/wrangler.js"
          RAW="$RUNNER_TEMP/customer-wrangler.raw.log"
          SAFE="$RUNNER_TEMP/customer-wrangler.sanitized.log"
          set +e
          CI=true WRANGLER_SEND_METRICS=false WRANGLER_LOG=error WRANGLER_LOG_SANITIZE=true \
            node "$WRANGLER" deploy --config v3customer/wrangler.release.jsonc --keep-vars --no-autoconfig >"$RAW" 2>&1
          rc=$?
          set -e
          RAW_LOG="$RAW" SAFE_LOG="$SAFE" node --input-type=module <<'NODE'
          import {readFile, writeFile} from 'node:fs/promises';
          let text = await readFile(process.env.RAW_LOG, 'utf8');
          for (const secret of [process.env.CLOUDFLARE_API_TOKEN, process.env.GH_TOKEN].filter(Boolean)) {
            text = text.split(secret).join('[REDACTED]');
          }
          text = text
            .replace(/Authorization\s*:\s*Bearer\s+[^\s'"\\]+/gi, 'Authorization: Bearer [REDACTED]')
            .replace(/Bearer\s+[A-Za-z0-9._~+\/=:-]{12,}/g, 'Bearer [REDACTED]')
            .replace(/((?:api[_-]?token|access[_-]?token|token)\s*[:=]\s*)[A-Za-z0-9._~+\/=:-]{12,}/gi, '$1[REDACTED]');
          const bounded = text.length > 30000 ? `[TRUNCATED_TO_LAST_30000_BYTES]\n${text.slice(-30000)}` : text;
          await writeFile(process.env.SAFE_LOG, bounded, {mode: 0o600});
          process.stdout.write(bounded.endsWith('\n') ? bounded : bounded + '\n');
          NODE
          rm -f "$RAW"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "safe_log=$SAFE" >> "$GITHUB_OUTPUT"
          echo "WRANGLER_EXIT_CODE=$rc"

      - name: Upload sanitized Wrangler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-customer-wrangler-sanitized-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/customer-wrangler.sanitized.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on Wrangler deployment error
        if: steps.wrangler.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "WRANGLER_DEPLOY_FAILED_EXIT_${{ steps.wrangler.outputs.exit_code }}"
          exit 1

      - name: Verify new Cloudflare deployment and preserved bindings
        if: steps.wrangler.outputs.exit_code == '0'
        id: postflight
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          PRE_VERSION='${{ steps.preflight.outputs.pre_version }}'
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${process.env.EXPECTED_SERVICE}`;
          async function cf(path) {
            const response = await fetch(base + path, {headers: {authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, accept: 'application/json'}, redirect: 'error', signal: AbortSignal.timeout(30000)});
            if (!response.ok) throw new Error(`CLOUDFLARE_POSTREAD_FAILED_${response.status}`);
            const body = await response.json();
            if (body?.success !== true) throw new Error('CLOUDFLARE_POSTREAD_INVALID');
            return body.result;
          }
          const settings = await cf('/settings');
          const safe = (settings?.bindings || []).map(({name, type, bucket_name}) => ({name, type, ...(bucket_name ? {bucket_name} : {})}));
          const names = new Map(safe.map(row => [row.name, row]));
          if (names.get('ASSETS')?.type !== 'assets' || names.get('CUSTOMER_ASSETS')?.type !== 'r2_bucket' || names.get('CUSTOMER_ASSETS')?.bucket_name !== 'mfk-customer-assets' || safe.length !== 2) {
            throw new Error('CUSTOMER_BINDINGS_NOT_PRESERVED');
          }
          const result = await cf('/deployments?page=1&per_page=1');
          const deployment = result?.deployments?.[0];
          const version = deployment?.versions?.[0];
          if (!deployment?.id || deployment.versions?.length !== 1 || version?.percentage !== 100 || typeof version.version_id !== 'string') throw new Error('CUSTOMER_POSTDEPLOYMENT_INVALID');
          if (version.version_id === process.env.PRE_VERSION) throw new Error('CUSTOMER_VERSION_DID_NOT_CHANGE');
          appendFileSync(process.env.GITHUB_OUTPUT, `deployment_id=${deployment.id}\nversion_id=${version.version_id}\n`);
          console.log(`CUSTOMER_POSTFLIGHT_VERIFIED deployment=${deployment.id} version=${version.version_id}`);
          NODE
        env:
          PRE_VERSION: ${{ steps.preflight.outputs.pre_version }}

      - name: Verify public Customer build identity
        if: steps.wrangler.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url = `https://${process.env.EXPECTED_HOST}/customer-build-identity.json`;
          let last = 'unread';
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const response = await fetch(url, {headers: {accept: 'application/json', 'cache-control': 'no-cache'}, redirect: 'error', signal: AbortSignal.timeout(20000)});
              last = `http-${response.status}`;
              if (response.ok) {
                const identity = await response.json();
                if (identity?.surface === 'MFP_CUSTOMER_V3' && identity.sourceCommit === process.env.GITHUB_SHA && identity.sourceDirty === false) {
                  console.log(`CUSTOMER_PUBLIC_IDENTITY_VERIFIED ${identity.sourceCommit}`);
                  process.exit(0);
                }
                last = 'identity-mismatch';
              }
            } catch (error) {
              last = error?.name || 'read-error';
            }
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error(`CUSTOMER_PUBLIC_IDENTITY_FAILED_${last}`);
          NODE

      - name: Publish deployment identity summary
        if: steps.wrangler.outputs.exit_code == '0'
        shell: bash
        run: |
          echo "CUSTOMER_DEPLOYED"
          echo "source_sha=$GITHUB_SHA"
          echo "deployment_id=${{ steps.postflight.outputs.deployment_id }}"
          echo "version_id=${{ steps.postflight.outputs.version_id }}"
          echo "url=https://$EXPECTED_HOST"
