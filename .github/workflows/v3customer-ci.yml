name: v3customer-ci

on:
  pull_request:
    paths:
      - "v3customer/**"
      - ".github/workflows/v3customer-ci.yml"
  push:
    branches-ignore:
      - main
    paths:
      - "v3customer/**"
      - ".github/workflows/v3customer-ci.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v3customer/package.json
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run build

  visual-capture:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/MFK-CUSTOMER-V3-LONG-HOME-R1'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: mfk-customer-assets
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/MFK-CUSTOMER-V3-LONG-HOME-R1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app dependencies
        working-directory: v3customer
        run: npm install --ignore-scripts

      - name: Pull canonical Hero assets from private R2
        run: |
          set -euo pipefail
          mkdir -p v3customer/public/media/customer/hero
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/hero/hero-background-main.png" --file "v3customer/public/media/customer/hero/hero-background-main.png" --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/hero/hero-male-main.png" --file "v3customer/public/media/customer/hero/hero-male-main.png" --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/hero/hero-female-main.png" --file "v3customer/public/media/customer/hero/hero-female-main.png" --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/hero/hero-doodle-morefun-main.png" --file "v3customer/public/media/customer/hero/hero-doodle-morefun-main.png" --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/hero/hero-doodle-goodtaste-main.png" --file "v3customer/public/media/customer/hero/hero-doodle-goodtaste-main.png" --remote
          mkdir -p v3customer/public/media/customer/home
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/home/chef-product-01.png" --file "v3customer/public/media/customer/home/chef-product-01.png" --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/home/chef-product-02.png" --file "v3customer/public/media/customer/home/chef-product-02.png" --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/home/chef-product-03.png" --file "v3customer/public/media/customer/home/chef-product-03.png" --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/home/chef-product-04.png" --file "v3customer/public/media/customer/home/chef-product-04.png" --remote

      - name: Install Chromium
        working-directory: v3customer
        run: npx playwright install chromium --with-deps

      - name: Render and validate 390px mobile evidence
        run: |
          set -euo pipefail
          cd v3customer
          npm run dev -- --port 4175 > /tmp/mfk-v3-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4175 >/dev/null; then
              break
            fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs/promises';

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({
            viewport:{width:390,height:890},
            deviceScaleFactor:1
          });
          await page.goto('http://127.0.0.1:4175',{waitUntil:'networkidle'});
          await page.evaluate(()=>document.fonts.ready);

          await fs.mkdir('/tmp/mfk-evidence',{recursive:true});
          await page.screenshot({path:'/tmp/mfk-evidence/long-home-390.png',fullPage:true});
          await page.locator('.hero').screenshot({path:'/tmp/mfk-evidence/hero-390.png'});

          const metrics=await page.evaluate(()=>{
            const r=(selector)=>document.querySelector(selector)?.getBoundingClientRect().toJSON();
            return {
              viewportWidth:innerWidth,
              viewportHeight:innerHeight,
              documentWidth:document.documentElement.scrollWidth,
              documentHeight:document.documentElement.scrollHeight,
              hero:r('.hero'),
              cta:r('.hero-copy > button'),
              quick:r('.quick'),
              quickCards:[...document.querySelectorAll('.quick-card')].map(el=>el.getBoundingClientRect().toJSON()),
              featured:r('.featured-section'),
              featuredCards:[...document.querySelectorAll('.featured-card')].map(el=>el.getBoundingClientRect().toJSON()),
              recent:r('.recent-section'),
              nav:r('nav'),
              navButtons:[...document.querySelectorAll('nav button')].map(el=>el.getBoundingClientRect().toJSON())
            };
          });

          const screens=metrics.documentHeight/metrics.viewportHeight;
          const fail=[];
          if(metrics.documentWidth>metrics.viewportWidth) fail.push('horizontal-overflow');
          if(!metrics.hero || metrics.hero.height<metrics.viewportHeight*0.60) fail.push('hero-under-60-percent');
          if(!metrics.hero || metrics.hero.height>metrics.viewportHeight*0.72) fail.push('hero-over-72-percent');
          if(screens<1.35 || screens>1.70) fail.push('home-not-1.5-screen-class');
          if(!metrics.cta || metrics.cta.height<48) fail.push('cta-touch-too-small');
          if(metrics.quickCards.length!==4 || metrics.quickCards.some(x=>x.height<100||x.width<150)) fail.push('quick-card-touch-contract');
          if(metrics.featuredCards.length!==2) fail.push('featured-count-not-two');
          if(metrics.navButtons.length!==4 || metrics.navButtons.some(x=>x.height<52)) fail.push('bottom-nav-touch-contract');

          metrics.pageScreens=Number(screens.toFixed(3));
          metrics.acceptance={
            heroShare:Number((metrics.hero.height/metrics.viewportHeight).toFixed(3)),
            failures:fail
          };

          await fs.writeFile('/tmp/mfk-evidence/metrics-390.json',JSON.stringify(metrics,null,2));
          if(fail.length){
            console.error(JSON.stringify(metrics,null,2));
            process.exit(1);
          }

          console.log(JSON.stringify(metrics.acceptance));
          await browser.close();
          NODE

      - name: Publish visual evidence branch
        run: |
          set -euo pipefail
          cp /tmp/mfk-evidence/long-home-390.png /tmp/long-home-390.png
          cp /tmp/mfk-evidence/hero-390.png /tmp/hero-390.png
          cp /tmp/mfk-evidence/metrics-390.json /tmp/metrics-390.json

          git config user.name "MFK Visual Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin temp/MFK-CUSTOMER-V3-VISUAL-EVIDENCE
          git switch -C temp/MFK-CUSTOMER-V3-VISUAL-EVIDENCE origin/temp/MFK-CUSTOMER-V3-VISUAL-EVIDENCE
          mkdir -p v3customer/evidence/current
          cp /tmp/long-home-390.png v3customer/evidence/current/long-home-390.png
          cp /tmp/hero-390.png v3customer/evidence/current/hero-390.png
          cp /tmp/metrics-390.json v3customer/evidence/current/metrics-390.json
          git add v3customer/evidence/current
          git commit -m "evidence(customer): refresh 390px visual capture" || exit 0
          git push origin HEAD:temp/MFK-CUSTOMER-V3-VISUAL-EVIDENCE


  deploy-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/MFK-CUSTOMER-V3-LONG-HOME-R1'
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: mfk-customer-assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull canonical Hero assets from private R2
        run: |
          set -euo pipefail
          mkdir -p v3customer/public/media/customer/hero
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/hero/hero-background-main.png" --file "v3customer/public/media/customer/hero/hero-background-main.png" --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/hero/hero-male-main.png" --file "v3customer/public/media/customer/hero/hero-male-main.png" --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/hero/hero-female-main.png" --file "v3customer/public/media/customer/hero/hero-female-main.png" --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/hero/hero-doodle-morefun-main.png" --file "v3customer/public/media/customer/hero/hero-doodle-morefun-main.png" --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/hero/hero-doodle-goodtaste-main.png" --file "v3customer/public/media/customer/hero/hero-doodle-goodtaste-main.png" --remote
          mkdir -p v3customer/public/media/customer/home
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/home/chef-product-01.png" --file "v3customer/public/media/customer/home/chef-product-01.png" --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/home/chef-product-02.png" --file "v3customer/public/media/customer/home/chef-product-02.png" --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/home/chef-product-03.png" --file "v3customer/public/media/customer/home/chef-product-03.png" --remote
          npx --yes wrangler@latest r2 object get "$BUCKET/customer/brand/home/chef-product-04.png" --file "v3customer/public/media/customer/home/chef-product-04.png" --remote

      - name: Build preview
        working-directory: v3customer
        run: |
          npm install --ignore-scripts
          npm run build

      - name: Ensure isolated Pages preview project
        working-directory: v3customer
        run: |
          npx --yes wrangler@latest pages project create mfk-customer-v3-preview --production-branch=preview || true

      - name: Deploy isolated V3 Customer preview
        working-directory: v3customer
        run: |
          npx --yes wrangler@latest pages deploy dist             --project-name=mfk-customer-v3-preview             --branch=preview             --commit-hash="$GITHUB_SHA"             --commit-message="MFK Customer V3 Owner preview"
