name: V2 Local POS Smoke

on:
  push:
    branches: [main, 'work/MFK/SMT-A3A-QUICK-NORMAL-2026-09-26']
    paths:
      - 'v2local/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        working-directory: v2local
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        working-directory: v2local
        run: npm run test

      - name: Build
        working-directory: v2local
        run: npm run build
      - name: Local authority and bounded cloud seam proof
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'SMT_GOLDEN_WIDTH=1920' v2local/src/app/production-viewport-layout.ts
          grep -F 'SMT_GOLDEN_HEIGHT=1080' v2local/src/app/production-viewport-layout.ts
          grep -F "id:'MFK-'" v2local/src/runtime/local-runtime.ts
          grep -F "providerRef===providerRef" v2local/src/runtime/local-runtime.ts
          grep -F "localRuntime.createOrder(orderInput)" v2local/src/runtime/keeta-order-intake.ts
          grep -F "KEETA_ORDER_AVAILABLE" v2local/src/runtime/keeta-order-intake.ts
          grep -F "KEETA_ORDER_EVENT_AVAILABLE" v2local/src/runtime/keeta-order-lifecycle.ts
          grep -F "installKeetaOrderLifecycle" v2local/src/main.tsx
          grep -F "applyProviderLifecycle" v2local/src/runtime/local-runtime.ts
          grep -F "KEETA_AFTER_SALE_AVAILABLE" v2local/src/runtime/keeta-after-sale.ts
          grep -F "installKeetaAfterSales" v2local/src/main.tsx
          grep -F "decideKeetaAfterSale" v2local/src/runtime/keeta-after-sale.ts
          grep -F "subscribeSmtCloudDoorbell" v2local/src/runtime/admin-config-sync.ts
          ! grep -RInF "print.sunmi." v2local/src
          grep -F "print.lan.endpoint.apply" v2local/src/runtime/native-print.ts
          grep -F "print.lan.endpoint.test" v2local/src/runtime/native-print.ts
          grep -F "print.lan.dispatch" v2local/src/runtime/native-print.ts
          grep -F "buildOrderPrintPlan" v2local/src/runtime/local-runtime.ts
          grep -F "localRuntime.printOrderOutputs(order.id)" v2local/src/App.tsx
          grep -F "runtime.reprintOrderJobs" v2local/src/presentation/RuntimeOrdersWorkspace.tsx
      - name: Static bundle proof
        shell: bash
        run: |
          set -euo pipefail
          test -s v2local/dist/index.html
          test -d v2local/dist/assets
