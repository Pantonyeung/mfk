name: mfk-smt-p1-3-table-registry-proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  proof:
    if: github.head_ref == 'work/MFK/SMT-P1-3-TABLE-REGISTRY-R1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install SMT
        working-directory: v2local
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: SMT tests
        working-directory: v2local
        run: npm run test
      - name: SMT build
        working-directory: v2local
        run: npm run build
      - name: Protected seams
        shell: bash
        run: |
          set -euo pipefail
          grep -F "readSmtDiningTableRegistry()" v2local/src/runtime/local-runtime.ts
          grep -F "DINING_TABLE_NOT_ASSIGNABLE" v2local/src/runtime/local-runtime.ts
          grep -F "DINING_TABLE_OCCUPIED" v2local/src/runtime/local-runtime.ts
          grep -F "view?.tables.find(table=>table.id===tableId)?.label??tableId" v2local/src/presentation/RuntimeDiningWorkspace.tsx
          grep -F "const diningTableDefinitions=storeSettings.diningTables.length" v2local/src/App.tsx
          grep -F "localRuntime.createOrder" v2local/src/App.tsx
      - name: Diff check
        run: git diff --check origin/main...HEAD
