name: mfk-dining-checkout-r3-proof
on:
  pull_request:
    branches: [work/MFK/SMT-DINING-SETTLEMENT-SAFETY-R2]
permissions:
  contents: write
jobs:
  proof:
    if: github.head_ref == 'work/MFK/SMT-DINING-CHECKOUT-FLOW-R3'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v2local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bounded patch and source evidence
        run: |
          mkdir -p /tmp/mfk-dining-r3
          git rev-parse HEAD > /tmp/mfk-dining-r3/input-sha.txt
          if [ -f acceptance/apply-dining-checkout-r3.mjs ]; then node acceptance/apply-dining-checkout-r3.mjs; fi
          cp src/App.tsx /tmp/mfk-dining-r3/App.tsx
          cp src/features/checkout/CheckoutWorkspace.tsx /tmp/mfk-dining-r3/CheckoutWorkspace.tsx
          cp src/features/checkout/checkout-workspace-model.ts /tmp/mfk-dining-r3/checkout-workspace-model.ts
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Unit and build
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/mfk-dining-r3/unit.log
          npm run build 2>&1 | tee /tmp/mfk-dining-r3/build.log
      - name: Browser tools
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Actual Checkout browser proof
        run: |
          set -o pipefail
          node acceptance/dining-checkout-r3-proof.mjs 2>&1 | tee /tmp/mfk-dining-r3/browser.log
      - name: Packaged offline tablet and desktop proof
        run: |
          set -o pipefail
          node acceptance/dining-checkout-r3-offline-proof.mjs 2>&1 | tee /tmp/mfk-dining-r3/offline-browser.log
      - name: Preserve R1 and R2 regression
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/mfk-dining-r3/vite.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/acceptance/dining.html >/dev/null && break; sleep 1; done
          node acceptance/dining-proof.mjs
          node acceptance/dining-payment-proof.mjs
          cp -r /tmp/mfk-dining-proof /tmp/mfk-dining-r3/r1-regression
          cp /tmp/mfk-dining-r2/payment-browser-report.json /tmp/mfk-dining-r3/r2-regression.json
      - name: Commit only validated bounded product patch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd ..
          branch='work/MFK/SMT-DINING-CHECKOUT-FLOW-R3'
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git diff --name-only | while IFS= read -r file; do
            case "$file" in
              v2local/src/App.tsx|v2local/src/features/checkout/CheckoutWorkspace.tsx|v2local/src/features/checkout/checkout-workspace-model.ts) ;;
              *) echo "Unexpected modified file: $file"; exit 1;;
            esac
          done
          git add v2local/src/App.tsx v2local/src/features/checkout/CheckoutWorkspace.tsx v2local/src/features/checkout/checkout-workspace-model.ts
          if [ -f v2local/src/features/checkout/dining-checkout-ui-session.ts ]; then git add v2local/src/features/checkout/dining-checkout-ui-session.ts; fi
          if ! git diff --cached --quiet; then
            git config user.name 'MFK isolated proof'
            git config user.email 'mfk-proof@users.noreply.github.com'
            git commit -m 'fix(smt): validated actual dining Checkout recovery and source lock R3'
            git push origin "HEAD:refs/heads/$branch"
          fi
          git rev-parse HEAD > /tmp/mfk-dining-r3/tested-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mfk-dining-r3-${{ github.run_id }}
          path: /tmp/mfk-dining-r3
          retention-days: 7
