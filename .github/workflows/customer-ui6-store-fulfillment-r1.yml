name: customer-ui6-store-fulfillment-r1

permissions:
  contents: read
  issues: write

on:
  push:
    branches:
      - work/MFK/CUSTOMER-UI6-STORE-FULFILLMENT-R1
    paths:
      - 'v2customer/**'
      - 'v2local/**'
      - 'v2admin/**'
      - 'contracts/**'
      - 'docs/handoff/MFK_CUSTOMER_UI6_STORE_FULFILLMENT_R1_HANDOFF_2026-09-27.md'
      - '.github/workflows/customer-ui6-store-fulfillment-r1.yml'
  pull_request:
    paths:
      - 'v2customer/**'
      - 'v2local/**'
      - 'v2admin/**'
      - 'contracts/**'
      - '.github/workflows/customer-ui6-store-fulfillment-r1.yml'
  workflow_dispatch:

jobs:
  customer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: UI6 Store Fulfillment contract
        run: node --test test/ui6-store-fulfillment-r1.test.mjs
      - name: UI5 regression
        run: node --test test/ui5-submit-wait-r1.test.mjs
      - name: Full Customer tests
        run: npm test
      - name: Customer build
        run: npm run build

  v2local:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Full v2local tests
        run: npm test
      - name: v2local build
        run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: UI6 canonical projection
        run: npx vitest run src/customer-ui6-projection.test.ts src/customer-cloud-edge.test.ts
      - name: Full Admin tests
        run: npm test
      - name: Admin build
        run: npm run build
      - name: Wrangler dry-run
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc

  report:
    if: always()
    needs: [customer, v2local, admin]
    runs-on: ubuntu-latest
    steps:
      - name: Publish acceptance result to issue 400
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOMER_RESULT: ${{ needs.customer.result }}
          V2LOCAL_RESULT: ${{ needs.v2local.result }}
          ADMIN_RESULT: ${{ needs.admin.result }}
        run: |
          BODY=$(cat <<EOF
          CUSTOMER UI6 STORE_FULFILLMENT R1｜CI RESULT

          RUN_ID: $GITHUB_RUN_ID
          SHA: $GITHUB_SHA
          BRANCH: $GITHUB_REF_NAME

          CUSTOMER: $CUSTOMER_RESULT
          V2LOCAL: $V2LOCAL_RESULT
          ADMIN: $ADMIN_RESULT

          Automated acceptance evidence only. No main merge and no production deploy were performed.
          EOF
          )
          gh api "repos/$GITHUB_REPOSITORY/issues/400/comments" -f body="$BODY"
