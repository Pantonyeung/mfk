name: mfk-smt-a3b-required-fast-lane-proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: github.head_ref == 'work/MFK/SMT-A3B-REQUIRED-FAST-LANE-R1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v2local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff check
        working-directory: .
        run: git diff --check origin/main...HEAD
