name: deploy-smt-frontline-layout-r3-preview-01

on:
  pull_request:
    branches:
      - work/MFK/SMT-FRONTLINE-LAYOUT-CORRECTION-R3
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
      - name: Upload SMT R3 preview
        run: npx --yes wrangler@latest versions upload --name mfk-admin --preview-alias smt-frontline-r3
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify preview
        run: curl --retry 5 --retry-delay 2 --fail --silent --show-error --head https://smt-frontline-r3-mfk-admin.yeungyi88.workers.dev
