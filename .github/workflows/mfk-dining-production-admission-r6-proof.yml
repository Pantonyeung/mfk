name: mfk-dining-production-admission-r6-proof
on:
  pull_request:
    branches: [proof/MFK/SMT-DINING-R6-BASE-2]
permissions:
  contents: read
jobs:
  proof:
    if: github.head_ref == 'proof/MFK/SMT-DINING-R6-RUN-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v2local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Unit and build
        run: |
          set -o pipefail
          npm test
          npm run build
