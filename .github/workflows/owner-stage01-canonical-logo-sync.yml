name: owner-stage01-canonical-logo-sync

on:
  push:
    branches:
      - work/MFK/OWNER-UI-STAGE01-TODAY-R1
    paths:
      - .github/workflows/owner-stage01-canonical-logo-sync.yml

permissions:
  contents: write

jobs:
  sync-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/MFK/OWNER-UI-STAGE01-TODAY-R1
          fetch-depth: 0
      - name: Fetch exact Owner-approved canonical logo
        run: |
          set -euo pipefail
          mkdir -p v2owner/public/brand
          curl --fail --location --silent --show-error \
            "https://cdn.creativeclaw.co/u/6ad84d58/images/83175cf7-37e1-4d80-87d4-d509eb385658.png" \
            -o v2owner/public/brand/morefun-logo-canonical.png
          echo "9932546497935faaaf9c8d75c5a193d5ce9e3d70c0e16bd9d9f987777790d95f  v2owner/public/brand/morefun-logo-canonical.png" | sha256sum -c -
      - name: Commit canonical asset to Stage01 branch only
        run: |
          set -euo pipefail
          if git diff --quiet -- v2owner/public/brand/morefun-logo-canonical.png; then
            echo "Canonical asset already exact."
            exit 0
          fi
          git config user.name "MFK Owner UI Stage01"
          git config user.email "actions@users.noreply.github.com"
          git add v2owner/public/brand/morefun-logo-canonical.png
          git commit -m "asset(owner-stage01): use exact Owner-approved canonical logo"
          git push origin HEAD:work/MFK/OWNER-UI-STAGE01-TODAY-R1
