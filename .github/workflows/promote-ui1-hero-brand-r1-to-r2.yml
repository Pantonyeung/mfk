name: promote-ui1-hero-brand-r1-to-r2

on:
  push:
    branches:
      - stage/MFK/CUSTOMER-PUBLIC
    paths:
      - .github/workflows/promote-ui1-hero-brand-r1-to-r2.yml

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download approved master
        run: |
          curl -fL --retry 3 \
            "https://cdn.creativeclaw.co/u/6ad84d58/images/0f574718-cf8e-4e74-84df-95ce1fbd750e.png" \
            -o hero-brand-r1.png
          test -s hero-brand-r1.png
          sha256sum hero-brand-r1.png

      - name: Upload master to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest r2 object put \
            mfk-customer-assets/customer/ui1/hero/master/hero-brand-r1.png \
            --file hero-brand-r1.png \
            --remote
