name: owner-p0-final-visual-w1

on:
  push:
    branches:
      - work/MFK/OWNER-P0-FINAL-VISUAL-SYSTEM-W1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Owner
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Owner full regression
        run: npm test
      - name: Owner build
        run: npm run build
      - name: Install browser evidence tooling
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture six FINAL Owner screenshots
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/mfk-owner-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          OWNER_VISUAL_URL=http://127.0.0.1:4173 node test/visual-evidence.mjs
      - name: Upload Owner visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: owner-p0-final-visual-evidence
          path: v2owner/artifacts/owner-p0-final-visual/*.png
          if-no-files-found: error
          retention-days: 30

  admin-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Admin full regression
        run: npm test
      - name: Admin build
        run: npm run build

  related-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: v2customer
            node: '22'
          - app: v2smm
            node: '22'
          - app: v2local
            node: '24'
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Relevant regression
        run: npm test
      - name: Relevant build
        run: npm run build

  owner-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Cloudflare dry-run only
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc
