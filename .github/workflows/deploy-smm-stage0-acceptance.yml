name: deploy-smm-stage0-acceptance

on:
  push:
    branches:
      - deploy/SMM-STAGE0-ACCEPTANCE-AAD53D5
    paths:
      - 'v2smm/SMM_STAGE0_ACCEPTANCE_DEPLOY_REQUEST'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2smm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Deploy Preview under existing mfk-smm-web
        id: preview
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.141.0 preview \
            --config wrangler.preview.jsonc \
            --worker-name mfk-smm-web \
            --name stage0-aad53d5 \
            --json | tee /tmp/smm-preview.json
          node <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/smm-preview.json','utf8').trim();
          const lines=raw.split(/\r?\n/).filter(Boolean);
          let parsed=null;
          for(let i=lines.length-1;i>=0;i--){
            try{parsed=JSON.parse(lines[i]);break}catch{}
          }
          if(!parsed){
            try{parsed=JSON.parse(raw)}catch{}
          }
          const walk=(v)=>{
            if(typeof v==='string' && /^https:\/\//.test(v) && v.includes('workers.dev')) return v;
            if(Array.isArray(v)) for(const x of v){const r=walk(x);if(r)return r;}
            if(v&&typeof v==='object') for(const x of Object.values(v)){const r=walk(x);if(r)return r;}
            return null;
          };
          const url=walk(parsed);
          if(!url) throw new Error('PREVIEW_URL_NOT_FOUND');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'preview_url='+url+'\n');
          console.log('SMM_PREVIEW_URL='+url);
          NODE
      - name: HTTP readback
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          code=""
          for i in $(seq 1 20); do
            code="$(curl -L -sS -o /tmp/smm-preview.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$PREVIEW_URL" || true)"
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          test "$code" = "200"
          grep -q '<div id="root"></div>' /tmp/smm-preview.html
          echo "SMM_STAGE0_PREVIEW_HTTP_200"
          echo "SMM_STAGE0_PREVIEW_URL=$PREVIEW_URL"
