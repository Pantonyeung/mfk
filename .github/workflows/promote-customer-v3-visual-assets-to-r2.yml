name: promote-customer-v3-visual-assets-to-r2

on:
  push:
    branches:
      - stage/MFK/CUSTOMER-PUBLIC
    paths:
      - ".github/workflows/promote-customer-v3-visual-assets-to-r2.yml"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: mfk-customer-assets

    steps:
      - name: Checkout isolated relay
        uses: actions/checkout@v4
        with:
          ref: temp/MFK-CUSTOMER-V3-VISUAL-ASSET-RELAY-20261001
          path: relay-src

      - name: Upload and verify product image masters
        run: |
          set -euo pipefail
          mkdir -p verify

          relay_one() {
            file="$1"
            key="$2"
            out="verify/$(basename "$file")"
            before="$(sha256sum "$file" | awk '{print $1}')"
            size="$(stat -c %s "$file")"

            npx --yes wrangler@latest r2 object put "$BUCKET/$key"               --file "$file"               --content-type "image/png"               --remote

            npx --yes wrangler@latest r2 object get "$BUCKET/$key"               --file "$out"               --remote

            after="$(sha256sum "$out" | awk '{print $1}')"
            test "$before" = "$after"
            printf '%s %s %s\n' "$key" "$before" "$size" >> verify/receipt.txt
          }

          relay_one "relay-src/relay/customer-v3-assets/chef-product-01.png" "customer/brand/home/chef-product-01.png"
          relay_one "relay-src/relay/customer-v3-assets/chef-product-02.png" "customer/brand/home/chef-product-02.png"
          relay_one "relay-src/relay/customer-v3-assets/chef-product-03.png" "customer/brand/home/chef-product-03.png"
          relay_one "relay-src/relay/customer-v3-assets/chef-product-04.png" "customer/brand/home/chef-product-04.png"

          cat verify/receipt.txt

      - name: Evidence summary
        run: |
          {
            echo "## Customer V3 product assets → R2"
            echo
            echo '~~~text'
            cat verify/receipt.txt
            echo '~~~'
            echo
            echo "Result: byte-for-byte SHA256 readback GREEN"
          } >> "$GITHUB_STEP_SUMMARY"
