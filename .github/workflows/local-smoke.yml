name: Local POS Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js
      - name: Local POS tests
        run: node --test tests/local-pos.test.mjs
      - name: Local HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/mfk-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/ >/tmp/index.html; then break; fi
            sleep 0.25
          done
          grep -F '<div id="app"></div>' /tmp/index.html
          curl -fsS http://127.0.0.1:8765/app.js | grep -F "const STORAGE_KEY='mfk.local.pos.v1'"
          curl -fsS http://127.0.0.1:8765/styles.css | grep -F '.app{'
