name: mfk-smt-a3e-frontline-presentation-proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  proof:
    if: github.head_ref == 'work/MFK/SMT-A3E-FRONTLINE-PRESENTATION-R1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Admin
        working-directory: v2admin
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Admin tests
        working-directory: v2admin
        run: npm run test
      - name: Admin build
        working-directory: v2admin
        run: npm run build
      - name: Install SMT
        working-directory: v2local
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: SMT tests
        working-directory: v2local
        run: npm run test
      - name: SMT build
        working-directory: v2local
        run: npm run build
      - name: Protected seams
        shell: bash
        run: |
          set -euo pipefail
          grep -F "localRuntime.createOrder" v2local/src/App.tsx
          grep -F "localRuntime.printOrderOutputs" v2local/src/App.tsx
          grep -F "saveAdminConfig(draft,undefined,'顯示設定 '+surface)" v2admin/src/DeferredWorkspaces.tsx
          grep -F -- "--ordering-product-columns" v2local/src/features/ordering/OrderingWorkspace.tsx
          grep -F "showDescriptions:frontlinePresentation.showDescriptions" v2local/src/App.tsx
      - name: Diff check
        run: git diff --check origin/main...HEAD
