name: mfk-smt-b1-payment-correction-proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  proof:
    if: github.head_ref == 'work/MFK/SMT-B1-PAYMENT-CORRECTION-R1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        working-directory: v2local
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Tests
        working-directory: v2local
        run: npm run test
      - name: Build
        working-directory: v2local
        run: npm run build
      - name: Protected seams
        shell: bash
        run: |
          set -euo pipefail
          grep -F "localRuntime.createOrder(orderInput)" v2local/src/runtime/keeta-order-intake.ts
          grep -F "buildOrderPrintPlan" v2local/src/runtime/local-runtime.ts
          grep -F "providerRef===providerRef" v2local/src/runtime/local-runtime.ts
          grep -F "ORDER_CORRECTION_PERMISSION_REQUIRED" v2local/src/runtime/local-runtime.ts
          grep -F "paymentCorrections" v2local/src/runtime/local-runtime.ts
      - name: Diff check
        run: git diff --check origin/main...HEAD
