name: deploy-customer-visual-art-direction-r3-preview

on:
  pull_request:
    branches:
      - work/MFK/CUSTOMER-VISUAL-ART-DIRECTION-R3
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
      - name: Upload Customer R3 acceptance preview
        run: npx --yes wrangler@latest versions upload --name mfk-admin --preview-alias customer-r3-acceptance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify acceptance preview
        run: curl --retry 5 --retry-delay 2 --fail --silent --show-error --head https://customer-r3-acceptance-mfk-admin.yeungyi88.workers.dev
