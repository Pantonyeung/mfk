name: deploy-mfk-smm-acceptance

on:
  pull_request:
    branches:
      - acceptance/MFK/SMM-PRODUCT-R1-CLOUDFLARE
  push:
    branches:
      - acceptance/MFK/SMM-PRODUCT-R1-CLOUDFLARE
    paths:
      - 'v2smm/DEPLOY_REQUEST'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2smm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
      - name: Upload SMM acceptance version to mfk-admin preview
        run: npx --yes wrangler@latest versions upload --name mfk-admin --preview-alias smm-acceptance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify acceptance preview
        run: curl --retry 5 --retry-delay 2 --fail --silent --show-error --head https://smm-acceptance-mfk-admin.yeungyi88.workers.dev
