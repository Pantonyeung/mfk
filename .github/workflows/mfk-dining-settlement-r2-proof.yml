name: mfk-dining-settlement-r2-proof
on:
  pull_request:
    branches: [work/MFK/SMT-OWNER-FINAL-DINING-INTERACTION-R1]
permissions:
  contents: write
jobs:
  proof:
    if: github.head_ref == 'work/MFK/SMT-DINING-SETTLEMENT-SAFETY-R2'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v2local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply bounded patch when supplied
        run: |
          mkdir -p /tmp/mfk-dining-r2
          git rev-parse HEAD | tee /tmp/mfk-dining-r2/input-sha.txt
          if [ -f acceptance/apply-dining-r2.mjs ]; then node acceptance/apply-dining-r2.mjs; fi
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Runtime regression
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/mfk-dining-r2/unit.log
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/mfk-dining-r2/build.log
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Browser regression
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/mfk-dining-r2/vite.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/acceptance/dining.html >/dev/null && break; sleep 1; done
          node acceptance/dining-proof.mjs
          cp -r /tmp/mfk-dining-proof /tmp/mfk-dining-r2/r1-regression
          if [ -f acceptance/dining-payment-proof.mjs ]; then node acceptance/dining-payment-proof.mjs; fi
      - name: Commit only validated product patch to isolated branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd ..
          branch='work/MFK/SMT-DINING-SETTLEMENT-SAFETY-R2'
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git diff --name-only | while IFS= read -r file; do
            case "$file" in
              v2local/src/runtime/local-runtime.ts|v2local/src/App.tsx|v2local/src/presentation/RuntimeDiningWorkspace.tsx) ;;
              *) echo "Unexpected patch path: $file"; exit 1;;
            esac
          done
          git add v2local/src/runtime/local-runtime.ts v2local/src/App.tsx v2local/src/presentation/RuntimeDiningWorkspace.tsx
          if ! git diff --cached --quiet; then
            git config user.name 'MFK isolated proof'
            git config user.email 'mfk-proof@users.noreply.github.com'
            git commit -m 'fix(smt): validated dining settlement replay and history-preserving release R2'
            git push origin "HEAD:refs/heads/$branch"
          fi
          git rev-parse HEAD | tee /tmp/mfk-dining-r2/tested-sha.txt
          git diff "$EXPECTED_HEAD" HEAD --stat > /tmp/mfk-dining-r2/product-diff.txt
          cp v2local/src/runtime/local-runtime.ts /tmp/mfk-dining-r2/local-runtime.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mfk-dining-r2-${{ github.run_id }}
          path: /tmp/mfk-dining-r2
          retention-days: 7
