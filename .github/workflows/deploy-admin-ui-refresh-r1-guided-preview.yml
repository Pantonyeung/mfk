name: deploy-admin-ui-refresh-r1-guided-preview

on:
  pull_request:
    branches:
      - work/MFK/ADMIN-UI-REFRESH-R1
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
      - name: Prepare static-only preview config
        run: |
          cat > wrangler.preview.jsonc <<'EOF'
          {
            "$schema": "https://raw.githubusercontent.com/cloudflare/workers-sdk/main/packages/wrangler/config-schema.json",
            "name": "mfk-admin",
            "compatibility_date": "2026-09-22",
            "workers_dev": true,
            "preview_urls": true,
            "assets": {
              "directory": "./dist",
              "not_found_handling": "single-page-application"
            }
          }
          EOF
      - name: Upload guided Admin UI preview
        run: npx --yes wrangler@latest versions upload --config wrangler.preview.jsonc --preview-alias admin-ui-refresh-r1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify preview
        run: curl --retry 5 --retry-delay 2 --fail --silent --show-error --head https://admin-ui-refresh-r1-mfk-admin.yeungyi88.workers.dev
