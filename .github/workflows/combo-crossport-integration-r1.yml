name: combo-crossport-integration-r1

on:
  push:
    branches:
      - integration/MFK/COMBO-DEPLOY-R1
      - main
    paths:
      - 'contracts/smm-lan-v1.ts'
      - 'v2smm/**'
      - 'v2local/src/runtime/smm-lan-ingress.ts'
      - 'v2local/src/runtime/smm-lan-ingress.test.ts'
      - 'v2local/src/runtime/smm-combo-revalidation.ts'
      - 'v2local/src/runtime/smm-combo-revalidation.test.ts'
      - 'v2local/src/runtime/customer-cloud-intake.ts'
      - 'v2admin/worker.ts'
      - 'v2customer/src/product-types.ts'
      - 'v2customer/test/admin-combo-drink-projection-r1.test.mjs'
      - '.github/workflows/combo-crossport-integration-r1.yml'
      - 'v2admin/DEPLOY_REQUEST'
  workflow_dispatch:

jobs:
  smm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2smm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build

  smt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build

  customer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
      - run: npx --yes wrangler@4.136.3 deploy --dry-run --config wrangler.jsonc
