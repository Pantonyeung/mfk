name: promote-customer-hero-assets-to-r2

on:
  push:
    branches:
      - stage/MFK/CUSTOMER-PUBLIC
    paths:
      - .github/workflows/promote-customer-hero-assets-to-r2.yml

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout relay source
        uses: actions/checkout@v4
        with:
          ref: temp/MFK-CUSTOMER-R2-ASSET-RELAY-20261001
          path: relay-src

      - name: Upload lossless masters to R2 and verify readback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BUCKET="mfk-customer-assets"
          mkdir -p verify

          relay_one() {
            file="$1"
            key="$2"
            out="verify/$(basename "$file")"
            before="$(sha256sum "$file" | awk '{print $1}')"
            size="$(stat -c %s "$file")"

            npx --yes wrangler@latest r2 object put "$BUCKET/$key" \
              --file "$file" \
              --content-type "image/png" \
              --remote

            npx --yes wrangler@latest r2 object get "$BUCKET/$key" \
              --file "$out" \
              --remote

            after="$(sha256sum "$out" | awk '{print $1}')"
            test "$before" = "$after"
            printf '%s %s %s\n' "$key" "$before" "$size" >> verify/receipt.txt
          }

          relay_one "relay-src/relay/customer-assets/hero-background-main.png" "customer/brand/hero/hero-background-main.png"
          relay_one "relay-src/relay/customer-assets/hero-male-main.png" "customer/brand/hero/hero-male-main.png"
          relay_one "relay-src/relay/customer-assets/hero-female-main.png" "customer/brand/hero/hero-female-main.png"
          relay_one "relay-src/relay/customer-assets/hero-doodle-morefun-main.png" "customer/brand/hero/hero-doodle-morefun-main.png"
          relay_one "relay-src/relay/customer-assets/hero-doodle-goodtaste-main.png" "customer/brand/hero/hero-doodle-goodtaste-main.png"

          cat verify/receipt.txt

      - name: Publish asset manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          rows=[]
          for line in Path("verify/receipt.txt").read_text().splitlines():
              key, sha256, size=line.split()
              rows.append({
                "key": key,
                "sha256": sha256,
                "sizeBytes": int(size),
                "contentType": "image/png"
              })

          Path("verify/asset-manifest.json").write_text(
            json.dumps({"assetGroup":"customer-hero","files":rows},indent=2)+"\n"
          )
          PY

          npx --yes wrangler@latest r2 object put \
            "mfk-customer-assets/customer/brand/hero/asset-manifest.json" \
            --file "verify/asset-manifest.json" \
            --content-type "application/json" \
            --remote

          npx --yes wrangler@latest r2 object get \
            "mfk-customer-assets/customer/brand/hero/asset-manifest.json" \
            --file "verify/asset-manifest-readback.json" \
            --remote

          cmp verify/asset-manifest.json verify/asset-manifest-readback.json

      - name: Evidence summary
        run: |
          {
            echo "## Customer hero assets → R2"
            echo
            echo '~~~text'
            cat verify/receipt.txt
            echo '~~~'
            echo
            echo "Result: byte-for-byte SHA256 readback GREEN"
          } >> "$GITHUB_STEP_SUMMARY"
