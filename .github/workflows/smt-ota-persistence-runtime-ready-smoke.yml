name: smt-ota-persistence-runtime-ready-smoke

on:
  push:
    branches:
      - work/MFK/SMT-OTA-PERSISTENCE-RUNTIME-READY-R1
  workflow_dispatch:

jobs:
  smt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
