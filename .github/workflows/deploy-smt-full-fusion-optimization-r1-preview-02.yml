name: deploy-smt-full-fusion-optimization-r1-preview-02

on:
  pull_request:
    branches:
      - work/MFK/SMT-FULL-FUSION-OPTIMIZATION-R1
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
      - name: Upload SMT Fusion R1 preview
        run: npx --yes wrangler@latest versions upload --name mfk-admin --preview-alias smt-fusion-r1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify preview
        run: curl --retry 5 --retry-delay 2 --fail --silent --show-error --head https://smt-fusion-r1-mfk-admin.yeungyi88.workers.dev
