name: customer-cloudflare-stage

on:
  push:
    branches:
      - stage/MFK/CUSTOMER-PUBLIC
      - temp/MFK-CUSTOMER-R2-ASSET-RELAY-20261001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-cloudflare-stage-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/stage/MFK/CUSTOMER-PUBLIC'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2customer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Ensure Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages project create mfk-customer-stage --production-branch=stage || true

      - name: Deploy fixed Customer Stage URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name=mfk-customer-stage \
            --branch=stage \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="MFK Customer public stage"

  relay-r2:
    if: github.ref == 'refs/heads/temp/MFK-CUSTOMER-R2-ASSET-RELAY-20261001'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: mfk-customer-assets

    steps:
      - name: Checkout relay
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Upload and byte-verify lossless PNG masters
        run: |
          set -euo pipefail
          mkdir -p verify

          relay_one() {
            file="$1"
            key="$2"
            name="$(basename "$file")"
            before="$(sha256sum "$file" | awk '{print $1}')"
            size="$(stat -c %s "$file")"

            echo "Uploading $file -> $BUCKET/$key"
            npx --yes wrangler@latest r2 object put "$BUCKET/$key" \
              --file="$file" \
              --content-type="image/png" \
              --remote

            npx --yes wrangler@latest r2 object get "$BUCKET/$key" \
              --file="verify/$name" \
              --remote

            after="$(sha256sum "verify/$name" | awk '{print $1}')"
            test "$before" = "$after"
            printf '%s %s %s\n' "$key" "$before" "$size" >> verify/receipt.txt
          }

          relay_one "relay/customer-assets/hero-background-main.png" "customer/brand/hero/hero-background-main.png"
          relay_one "relay/customer-assets/hero-male-main.png" "customer/brand/hero/hero-male-main.png"
          relay_one "relay/customer-assets/hero-female-main.png" "customer/brand/hero/hero-female-main.png"
          relay_one "relay/customer-assets/hero-doodle-morefun-main.png" "customer/brand/hero/hero-doodle-morefun-main.png"
          relay_one "relay/customer-assets/hero-doodle-goodtaste-main.png" "customer/brand/hero/hero-doodle-goodtaste-main.png"

          cat verify/receipt.txt

      - name: Upload receipt manifest and verify it
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          rows=[]
          for line in Path("verify/receipt.txt").read_text().splitlines():
              key, sha256, size=line.split()
              rows.append({
                  "key": key,
                  "sha256": sha256,
                  "sizeBytes": int(size),
                  "contentType": "image/png"
              })

          Path("verify/asset-manifest.json").write_text(
              json.dumps({"assetGroup":"customer-hero","files":rows},indent=2)+"\n"
          )
          PY

          npx --yes wrangler@latest r2 object put \
            "$BUCKET/customer/brand/hero/asset-manifest.json" \
            --file="verify/asset-manifest.json" \
            --content-type="application/json" \
            --remote

          npx --yes wrangler@latest r2 object get \
            "$BUCKET/customer/brand/hero/asset-manifest.json" \
            --file="verify/asset-manifest-readback.json" \
            --remote

          cmp verify/asset-manifest.json verify/asset-manifest-readback.json

      - name: Evidence summary
        run: |
          {
            echo "## Customer hero R2 relay"
            echo
            echo '~~~text'
            cat verify/receipt.txt
            echo '~~~'
            echo
            echo "Bucket: $BUCKET"
            echo "Result: byte-for-byte SHA256 readback GREEN"
          } >> "$GITHUB_STEP_SUMMARY"
