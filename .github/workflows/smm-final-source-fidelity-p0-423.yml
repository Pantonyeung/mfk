name: smm-final-source-fidelity-p0-423

on:
  push:
    branches:
      - work/smm-p0-source-fidelity-423
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2smm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Stage 0-4 source fidelity
        run: node --test test/stage0-ui.test.mjs test/stage1-ui.test.mjs test/stage2-ui.test.mjs test/stage3-ui.test.mjs test/stage4-checkout.test.mjs
      - name: Stage 5-7 regression
        run: node --test test/stage5-submit.test.mjs test/stage6-queue.test.mjs test/stage7-orders.test.mjs
      - name: Full SMM
        run: npm test
      - name: Build
        run: npm run build
      - name: Wrangler dry-run only
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc

  v2local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build

  admin-customer-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        port: [v2admin, v2customer, v2owner]
    defaults:
      run:
        working-directory: ${{ matrix.port }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
