name: MFK SMT Emergency Polling Stop 2026-10-02

on:
  push:
    branches:
      - feat/MFK-UNIFIED-SURFACES-R1-2026-10-02
    paths:
      - '.github/workflows/mfk-smt-emergency-stop-2026-10-02.yml'

permissions:
  contents: read

concurrency:
  group: mfk-smt-emergency-stop-2026-10-02
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install
        working-directory: v2local
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Emergency containment tests
        working-directory: v2local
        run: npx vitest run src/runtime/request-storm-containment.test.ts src/runtime/integrated-main-e2e-lock-r1.test.ts src/runtime/admin-config-sync.test.ts

      - name: Full SMT tests
        working-directory: v2local
        run: npm test

      - name: Build
        working-directory: v2local
        run: npm run build

      - name: Bundle Worker module for direct API deploy
        working-directory: v2local
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=esbuild@0.25.10 -- esbuild web-acceptance-worker.ts --bundle --format=esm --target=es2022 --outfile="$RUNNER_TEMP/mfk-smt-web-worker.mjs"
          test -s "$RUNNER_TEMP/mfk-smt-web-worker.mjs"

      - name: Deploy exact candidate to mfk-smt-web through Cloudflare API
        working-directory: v2local
        shell: bash
        env:
          MFK_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          (async()=>{
          const fs=require('node:fs');
          const path=require('node:path');
          const crypto=require('node:crypto');

          const apiToken=process.env.CLOUDFLARE_API_TOKEN;
          const accountId=process.env.CLOUDFLARE_ACCOUNT_ID;
          const sourceSha=process.env.MFK_SOURCE_SHA;
          const workerName='mfk-smt-web';
          const assetsDir=path.resolve('dist');
          const workerFile=process.env.RUNNER_TEMP+'/mfk-smt-web-worker.mjs';
          const buildId=fs.readFileSync('BUILD_ID','utf8').trim();

          for(const [name,value] of Object.entries({CLOUDFLARE_API_TOKEN:apiToken,CLOUDFLARE_ACCOUNT_ID:accountId,MFK_SOURCE_SHA:sourceSha})){
            if(!value)throw new Error('MISSING_'+name);
          }
          if(!/^[0-9a-f]{40}$/.test(sourceSha))throw new Error('SOURCE_SHA_INVALID');

          const mimeByExt={
            html:'text/html; charset=utf-8',
            js:'application/javascript; charset=utf-8',
            mjs:'application/javascript; charset=utf-8',
            css:'text/css; charset=utf-8',
            json:'application/json; charset=utf-8',
            svg:'image/svg+xml',
            png:'image/png',
            jpg:'image/jpeg',
            jpeg:'image/jpeg',
            webp:'image/webp',
            gif:'image/gif',
            ico:'image/x-icon',
            txt:'text/plain; charset=utf-8',
            woff:'font/woff',
            woff2:'font/woff2'
          };

          const files=[];
          const walk=(dir,base='')=>{
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,ent.name);
              const rel=path.posix.join(base,ent.name);
              if(ent.isDirectory())walk(full,rel);
              else if(ent.isFile()){
                const buf=fs.readFileSync(full);
                const ext=path.extname(rel).slice(1).toLowerCase();
                const hash=crypto.createHash('sha256').update(buf.toString('base64')+ext).digest('hex').slice(0,32);
                files.push({full,rel:'/'+rel.replaceAll('\\','/'),buf,ext,hash,size:buf.length,mime:mimeByExt[ext]||'application/octet-stream'});
              }
            }
          };
          walk(assetsDir);
          if(!files.length)throw new Error('NO_ASSETS');

          const manifest=Object.fromEntries(files.map(f=>[f.rel,{hash:f.hash,size:f.size}]));
          const apiBase='https://api.cloudflare.com/client/v4/accounts/'+accountId;
          const auth={'Authorization':'Bearer '+apiToken};

          const sessionResponse=await fetch(apiBase+'/workers/scripts/'+workerName+'/assets-upload-session',{
            method:'POST',
            headers:{...auth,'content-type':'application/json'},
            body:JSON.stringify({manifest})
          });
          const sessionBody=await sessionResponse.json();
          if(!sessionResponse.ok||sessionBody.success!==true)throw new Error('ASSET_SESSION_FAILED '+JSON.stringify(sessionBody));
          const uploadJwt=sessionBody.result?.jwt;
          const buckets=sessionBody.result?.buckets||[];
          if(!uploadJwt)throw new Error('ASSET_SESSION_JWT_MISSING');

          const byHash=new Map(files.map(f=>[f.hash,f]));
          let completionJwt=buckets.length===0?uploadJwt:null;
          for(const bucket of buckets){
            const form=new FormData();
            for(const hash of bucket){
              const f=byHash.get(hash);
              if(!f)throw new Error('ASSET_HASH_UNKNOWN '+hash);
              form.append(hash,new Blob([f.buf.toString('base64')],{type:f.mime}),hash);
            }
            const uploadResponse=await fetch(apiBase+'/workers/assets/upload?base64=true',{
              method:'POST',
              headers:{'Authorization':'Bearer '+uploadJwt},
              body:form
            });
            const uploadBody=await uploadResponse.json();
            if(!uploadResponse.ok||uploadBody.success!==true)throw new Error('ASSET_UPLOAD_FAILED '+JSON.stringify(uploadBody));
            if(uploadBody.result?.jwt)completionJwt=uploadBody.result.jwt;
          }
          if(!completionJwt)throw new Error('ASSET_COMPLETION_JWT_MISSING');

          const metadata={
            main_module:'worker.mjs',
            compatibility_date:'2026-09-25',
            assets:{
              jwt:completionJwt,
              config:{not_found_handling:'single-page-application'}
            },
            bindings:[
              {type:'assets',name:'ASSETS'},
              {type:'plain_text',name:'MFK_SOURCE_SHA',text:sourceSha},
              {type:'plain_text',name:'MFK_BUILD_ID',text:buildId}
            ]
          };
          const form=new FormData();
          form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}),'metadata.json');
          form.append('worker.mjs',new Blob([fs.readFileSync(workerFile)],{type:'application/javascript+module'}),'worker.mjs');

          const deployResponse=await fetch(apiBase+'/workers/scripts/'+workerName,{
            method:'PUT',
            headers:auth,
            body:form
          });
          const deployBody=await deployResponse.json();
          if(!deployResponse.ok||deployBody.success!==true)throw new Error('WORKER_DEPLOY_FAILED '+JSON.stringify(deployBody));
          console.log('DEPLOYED mfk-smt-web sourceSha='+sourceSha+' buildId='+buildId);
          console.log(JSON.stringify(deployBody.result||{}));
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Runtime readback
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://mfk-smt-web.yeungyi88.workers.dev
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS -H 'Cache-Control: no-cache' "$BASE_URL/__mfk/build" -o /tmp/build.json; then
              if node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/build.json','utf8'));
          const expected=process.env.EXPECTED_SHA;
          if(x.sourceSha!==expected||x.mode!=='PUBLIC_SMT_SHELL')process.exit(1);
          console.log(JSON.stringify(x));
          NODE
              then break; fi
            fi
            sleep 2
          done

          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/build.json','utf8'));
          if(x.sourceSha!==process.env.EXPECTED_SHA||x.mode!=='PUBLIC_SMT_SHELL')process.exit(1);
          NODE

          curl -fsS -H 'Cache-Control: no-cache' "$BASE_URL/__mfk/health" -o /tmp/health.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(x.mode!=='PUBLIC_SMT_SHELL'||x.businessMutationAuth!=='FORMAL_STAFF_AUTH_REQUIRED')process.exit(1);
          console.log(JSON.stringify(x));
          NODE

          ROOT_CODE="$(curl -sS -o /tmp/root.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE_URL/")"
          test "$ROOT_CODE" = 200

          PROXY_CODE="$(curl -sS -o /tmp/proxy.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE_URL/__mfk/admin/api/admin-sync/active?storeId=MF01")"
          test "$PROXY_CODE" = 401
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/proxy.json','utf8'));
          if(x.code!=='PUBLIC_SMT_STAFF_AUTH_REQUIRED')process.exit(1);
          console.log(JSON.stringify(x));
          NODE

# retry-after-duplicate-helper-fix

