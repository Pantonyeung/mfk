name: MFK SMT Emergency Polling Stop 2026-10-02

on:
  push:
    branches:
      - feat/MFK-UNIFIED-SURFACES-R1-2026-10-02
    paths:
      - '.github/workflows/mfk-smt-emergency-stop-2026-10-02.yml'

permissions:
  contents: read

concurrency:
  group: mfk-smt-emergency-stop-2026-10-02
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install
        working-directory: v2local
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Emergency containment tests
        working-directory: v2local
        run: npx vitest run src/runtime/request-storm-containment.test.ts src/runtime/integrated-main-e2e-lock-r1.test.ts src/runtime/admin-config-sync.test.ts

      - name: Full SMT tests
        working-directory: v2local
        run: npm test

      - name: Build
        working-directory: v2local
        run: npm run build

      - name: Deploy exact candidate to mfk-smt-web
        working-directory: v2local
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="$(cat BUILD_ID)"
          npx --yes wrangler@4.136.3 deploy --config wrangler.web-acceptance.jsonc \
            --var MFK_SOURCE_SHA:"$GITHUB_SHA" \
            --var MFK_BUILD_ID:"$BUILD_ID"

      - name: Runtime readback
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://mfk-smt-web.yeungyi88.workers.dev
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS -H 'Cache-Control: no-cache' "$BASE_URL/__mfk/build" -o /tmp/build.json; then
              if node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/build.json','utf8'));
          const expected=process.env.EXPECTED_SHA;
          if(x.sourceSha!==expected||x.mode!=='PUBLIC_SMT_SHELL')process.exit(1);
          console.log(JSON.stringify(x));
          NODE
              then break; fi
            fi
            sleep 2
          done

          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/build.json','utf8'));
          if(x.sourceSha!==process.env.EXPECTED_SHA||x.mode!=='PUBLIC_SMT_SHELL')process.exit(1);
          NODE

          curl -fsS -H 'Cache-Control: no-cache' "$BASE_URL/__mfk/health" -o /tmp/health.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(x.mode!=='PUBLIC_SMT_SHELL'||x.businessMutationAuth!=='FORMAL_STAFF_AUTH_REQUIRED')process.exit(1);
          console.log(JSON.stringify(x));
          NODE

          ROOT_CODE="$(curl -sS -o /tmp/root.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE_URL/")"
          test "$ROOT_CODE" = 200

          PROXY_CODE="$(curl -sS -o /tmp/proxy.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE_URL/__mfk/admin/api/admin-sync/active?storeId=MF01")"
          test "$PROXY_CODE" = 401
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/proxy.json','utf8'));
          if(x.code!=='PUBLIC_SMT_STAFF_AUTH_REQUIRED')process.exit(1);
          console.log(JSON.stringify(x));
          NODE

# retry-after-duplicate-helper-fix

# retry-with-pinned-wrangler-4.136.3
