name: mfk-smt-a3d-riceball-pairing-proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: github.head_ref == 'work/MFK/SMT-A3D-RICEBALL-COMBO-PAIRING-R1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        working-directory: v2local
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        working-directory: v2local
        run: npm run test
      - name: Build
        working-directory: v2local
        run: npm run build
      - name: Local authority and protected seams
        shell: bash
        run: |
          set -euo pipefail
          grep -F "localRuntime.createOrder(orderInput)" v2local/src/runtime/keeta-order-intake.ts
          grep -F "buildOrderPrintPlan" v2local/src/runtime/local-runtime.ts
          grep -F "providerRef===providerRef" v2local/src/runtime/local-runtime.ts
          grep -F "localRuntime.printOrderOutputs(order.id)" v2local/src/App.tsx
          ! grep -RInF "includes('飯團')" v2local/src/features/ordering/riceball-pairing-model.ts
      - name: Static bundle proof
        shell: bash
        run: |
          set -euo pipefail
          test -s v2local/dist/index.html
          test -d v2local/dist/assets
      - name: Diff check
        run: git diff --check origin/main...HEAD
