name: v3admin-ci

on:
  pull_request:
    branches: [main]
    paths:
      - 'v3admin/**'
      - 'COMMANDER_CURRENT.md'
      - 'HANDOFF_CURRENT.md'
      - 'docs/governance/MFK_WEB_CLIENT_PARALLEL_REBIRTH_AUTHORITY_R2_2026-09-30.md'
      - 'contracts/web-state-authority-v1.ts'
      - 'contracts/admin-config-sync-v1.ts'
      - '.github/mfk-change-manifest.json'
      - '.github/workflows/v3admin-ci.yml'
  push:
    branches: [main]
    paths:
      - 'v3admin/**'
      - 'COMMANDER_CURRENT.md'
      - 'HANDOFF_CURRENT.md'
      - 'docs/governance/MFK_WEB_CLIENT_PARALLEL_REBIRTH_AUTHORITY_R2_2026-09-30.md'
      - 'contracts/web-state-authority-v1.ts'
      - 'contracts/admin-config-sync-v1.ts'
      - '.github/mfk-change-manifest.json'
      - '.github/workflows/v3admin-ci.yml'

permissions:
  contents: read

jobs:
  v3admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify zero production routing
        run: |
          test ! -f wrangler.jsonc
          test ! -f DEPLOY_REQUEST
          test ! -f PREVIEW_DEPLOY_TRIGGER
          ! grep -R "admin.morefunos.com" -n src index.html package.json | grep -v "vite.config.ts"
