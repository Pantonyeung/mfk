name: owner-oa-chn-pln-r1

on:
  push:
    branches:
      - work/MFK/OWNER-OA-CHN-PLN-REWORK-R1
  workflow_dispatch:

jobs:
  owner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
      - run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
