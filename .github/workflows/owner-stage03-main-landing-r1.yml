name: owner-stage03-main-landing-r1

on:
  push:
    branches:
      - integration/MFK/OWNER-STAGE03-MAIN-LANDING-R1
      - main
    paths:
      - 'v2owner/**'
      - '.github/workflows/owner-stage03-main-landing-r1.yml'
  pull_request:
    paths:
      - 'v2owner/**'
      - '.github/workflows/owner-stage03-main-landing-r1.yml'
  workflow_dispatch:

jobs:
  owner-stage03:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
