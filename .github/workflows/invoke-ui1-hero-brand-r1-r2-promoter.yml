name: invoke-ui1-hero-brand-r1-r2-promoter

on:
  push:
    branches:
      - stage/MFK/CUSTOMER-PUBLIC
    paths:
      - .github/workflows/invoke-ui1-hero-brand-r1-r2-promoter.yml

permissions:
  contents: read

jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for promoter deployment and invoke
        run: |
          set -e
          URL='https://mfk-customer-stage.pages.dev/__asset_promote_ui1_hero_brand_r1?token=ui1-hero-brand-r1-8e5c2a7f4d91c3b6'
          for i in $(seq 1 20); do
            echo "Attempt $i"
            if curl -fsS "$URL" -o response.json; then
              cat response.json
              grep -q '"ok":true' response.json
              grep -q '"key":"customer/ui1/hero/master/hero-brand-r1.png"' response.json
              grep -q '"sha256":"5a4c4d0a148bca33f22c31651c3fcf74b3c0d594687f3173dfb6a06b718692ce"' response.json
              exit 0
            fi
            sleep 6
          done
          echo "Promoter endpoint did not become ready"
          exit 1
