name: deploy-mfk-smt-ui-preview

on:
  pull_request:
    branches:
      - work/MFK/SMT-HUMAN-UI-RECOMPOSITION-R1
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact product candidate boundary
        shell: bash
        run: |
          echo "Preview source: $GITHUB_SHA"
          git diff --exit-code 171328b0fec5debd051c3a27eb627933c62768f8 -- src/runtime

      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build

      - name: Upload SMT Human UI R1 preview
        run: npx --yes wrangler@latest versions upload --config wrangler.preview.jsonc --preview-alias smt-human-ui-r1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify preview
        run: curl --retry 5 --retry-delay 2 --fail --silent --show-error --head https://smt-human-ui-r1-mfk-admin.yeungyi88.workers.dev
