name: v2admin-smoke

on:
  push:
    branches:
      - work/MFK/ADMIN-CLEAN-ISOLATION-R1
  workflow_dispatch:

jobs:
  v2admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
