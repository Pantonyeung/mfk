name: admin-canonical-readback-r1

on:
  push:
    branches:
      - work/MFK/ADMIN-CANONICAL-READBACK-R1
  pull_request:
    paths:
      - 'v2admin/**'
      - '.github/workflows/admin-canonical-readback-r1.yml'
  workflow_dispatch:

jobs:
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
      - run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
