name: deploy-mfk-admin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'v2admin/**'
      - 'contracts/**'
      - '!v2admin/BUILD_ID'
      - '!v2admin/DEPLOY_REQUEST'
      - '!v2admin/PREVIEW_DEPLOY_TRIGGER'
      - '!v2admin/**/*.md'

concurrency:
  group: mfk-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2admin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
        env:
          MFK_SOURCE_SHA: ${{ github.sha }}
      - name: Prepare mfk-admin runtime secrets
        shell: bash
        env:
          KEETA_APP_SECRET: ${{ secrets.KEETA_APP_SECRET }}
          KEETA_TOKEN_ENCRYPTION_KEY: ${{ secrets.KEETA_TOKEN_ENCRYPTION_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const required = ['KEETA_APP_SECRET', 'KEETA_TOKEN_ENCRYPTION_KEY'];
          for (const name of required) {
            if (!process.env[name]) {
              console.error('Missing GitHub Actions secret: ' + name);
              process.exit(1);
            }
          }
          const encryptionKey = process.env.KEETA_TOKEN_ENCRYPTION_KEY.trim();
          const keyBytes = Buffer.from(encryptionKey, 'base64');
          if (!/^[A-Za-z0-9+/]{43}=$/.test(encryptionKey) || keyBytes.length !== 32) {
            console.error('Invalid GitHub Actions secret: KEETA_TOKEN_ENCRYPTION_KEY must be Base64 for exactly 32 bytes');
            process.exit(1);
          }
          fs.writeFileSync('.wrangler-secrets.json', JSON.stringify({
            KEETA_APP_SECRET: process.env.KEETA_APP_SECRET,
            KEETA_TOKEN_ENCRYPTION_KEY: encryptionKey,
          }));
          NODE
      - name: Customer payment evidence R2 preflight
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: mfk-customer-payment-evidence
        run: |
          set -u
          if npx --yes wrangler@latest r2 bucket info "$R2_BUCKET" --json >/tmp/mfk-r2-info.json 2>/tmp/mfk-r2-info.err; then
            echo "R2 bucket visible to deploy token: $R2_BUCKET"
            cat /tmp/mfk-r2-info.json
          else
            echo "::warning::Deploy token cannot verify R2 bucket. Continuing to Worker deploy; binding validation will fail closed if the bucket is still missing."
            cat /tmp/mfk-r2-info.err || true
          fi

      - name: Wrangler deploy preflight
        run: npx --yes wrangler@latest deploy --dry-run --outdir /tmp/mfk-admin-deploy-preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MFK_SOURCE_SHA: ${{ github.sha }}
      - name: Deploy mfk-admin
        run: npx --yes wrangler@latest deploy --secrets-file .wrangler-secrets.json --var MFK_SOURCE_SHA:$GITHUB_SHA
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Production health and source readback
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const expected=process.env.EXPECTED_SHA;
          const endpoint='https://admin.morefunos.com/api/health';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          let last='no response';
          for(let attempt=1;attempt<=12;attempt++){
            try{
              const response=await fetch(endpoint,{headers:{accept:'application/json','cache-control':'no-cache'}});
              const body=await response.json();
              last=JSON.stringify({status:response.status,body});
              if(response.ok&&body?.ok===true&&body?.service==='mfk-admin'&&body?.sourceSha===expected){
                console.log('RELEASED sourceSha='+body.sourceSha);
                process.exit(0);
              }
            }catch(error){last=String(error);}
            await sleep(5000);
          }
          console.error('Admin production readback mismatch: expected '+expected+'; last='+last);
          process.exit(1);
          NODE
      - name: Remove temporary secret file
        if: always()
        run: rm -f .wrangler-secrets.json
