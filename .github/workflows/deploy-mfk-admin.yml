name: deploy-mfk-admin

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'v2admin/PREVIEW_DEPLOY_TRIGGER'
  push:
    branches:
      - main
    paths:
      - 'v2admin/DEPLOY_REQUEST'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
      - name: Prepare mfk-admin runtime secrets
        shell: bash
        env:
          KEETA_APP_SECRET: ${{ secrets.KEETA_APP_SECRET }}
          KEETA_TOKEN_ENCRYPTION_KEY: ${{ secrets.KEETA_TOKEN_ENCRYPTION_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const required = ['KEETA_APP_SECRET', 'KEETA_TOKEN_ENCRYPTION_KEY'];
          for (const name of required) {
            if (!process.env[name]) {
              console.error('Missing GitHub Actions secret: ' + name);
              process.exit(1);
            }
          }
          const encryptionKey = process.env.KEETA_TOKEN_ENCRYPTION_KEY.trim();
          const keyBytes = Buffer.from(encryptionKey, 'base64');
          if (!/^[A-Za-z0-9+/]{43}=$/.test(encryptionKey) || keyBytes.length !== 32) {
            console.error('Invalid GitHub Actions secret: KEETA_TOKEN_ENCRYPTION_KEY must be Base64 for exactly 32 bytes');
            process.exit(1);
          }
          fs.writeFileSync('.wrangler-secrets.json', JSON.stringify({
            KEETA_APP_SECRET: process.env.KEETA_APP_SECRET,
            KEETA_TOKEN_ENCRYPTION_KEY: encryptionKey,
          }));
          NODE
      - name: Deploy mfk-admin
        run: npx --yes wrangler@latest deploy --secrets-file .wrangler-secrets.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Remove temporary secret file
        if: always()
        run: rm -f .wrangler-secrets.json
