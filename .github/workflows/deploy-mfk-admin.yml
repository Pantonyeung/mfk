name: deploy-mfk-admin

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed 40-character release branch HEAD
        type: string
        required: true
      connector_evidence:
        description: Fresh root-verified Cloudflare connector JSON attestation for this exact source and target
        type: string
        required: true
      target:
        description: Existing V3 service to verify or deploy
        type: choice
        options: [all, admin, pos, customer]
        default: all
        required: true
      operation:
        description: Preflight is read-only; deploy replaces code/assets on existing services
        type: choice
        options: [preflight, deploy]
        default: preflight
        required: true

permissions:
  contents: read

concurrency:
  group: mfk-admin-production
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.guard.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test bounded release guards without Cloudflare credentials
        run: node --test .github/scripts/test-v3-release-preflight.mjs
      - name: Verify trusted manual branch, local HEAD and current remote HEAD
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/v3-release-preflight.mjs guard

  release:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start sanitized per-target receipt
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: node .github/scripts/v3-release-preflight.mjs init "$RELEASE_TARGET"
      - name: Reverify exact source before dependency installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/v3-release-preflight.mjs guard
      - name: Install exact release tooling before Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/v3-release-tools" --no-save --package-lock=false --no-audit --no-fund wrangler@4.146.0
      - name: Build and test selected surface before Cloudflare credentials
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          MFK_SOURCE_SHA: ${{ github.sha }}
          MFP_SOURCE_SHA: ${{ github.sha }}
          VITE_MFK_V3_CONFIG_WRITES_ENABLED: '0'
          VITE_MFK_V3_PREVIEW_MODE: '0'
          VITE_MFK_V3_R2_MEDIA_ENABLED: '0'
          VITE_MFK_ADMIN_API_BASE: ''
          VITE_MFK_V3_PREVIEW_API_BASE: ''
        run: |
          set -euo pipefail
          case "$RELEASE_TARGET" in
            admin) surface=v3admin ;;
            pos) surface=v3smt ;;
            customer) surface=v3customer ;;
            *) exit 1 ;;
          esac
          (
            cd "$surface"
            npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
            npm run typecheck
            if [ "$RELEASE_TARGET" = customer ]; then
              node --test test/acceptance-cutover.checks.mjs
            else
              npm test
            fi
            npm run build
          )
          git diff --quiet HEAD -- .
          node .github/scripts/v3-release-preflight.mjs verify-build "$RELEASE_TARGET"
      - name: Reverify current remote source before Cloudflare credential step
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/v3-release-preflight.mjs guard
      - name: Existing-service preflight and optional guarded deployment
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/scripts/v3-release-preflight.mjs release "$RELEASE_TARGET"
      - name: Finalize receipt even after partial failure
        if: always()
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_JOB_STATUS: ${{ job.status }}
        run: node .github/scripts/v3-release-preflight.mjs finalize "$RELEASE_TARGET"
      - name: Upload sanitized target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-release-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/${{ matrix.target }}/receipt.json
          if-no-files-found: error
          retention-days: 30
