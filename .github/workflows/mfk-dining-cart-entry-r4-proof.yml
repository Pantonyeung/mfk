name: mfk-dining-cart-entry-r4-proof
on:
  pull_request:
    branches: [work/MFK/SMT-DINING-CHECKOUT-FLOW-R3]
permissions:
  contents: write
jobs:
  proof:
    if: github.head_ref == 'work/MFK/SMT-DINING-CART-ENTRY-R4'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v2local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Unit and build
        run: |
          set -o pipefail
          npm test
          npm run build
      - name: Browser tools
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Rendered interaction proof
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/mfk-dining-r4-vite.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/acceptance/dining-cart-entry-r4.html >/dev/null && break; sleep 1; done
          node acceptance/dining-cart-entry-r4-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mfk-dining-cart-entry-r4-${{ github.run_id }}
          path: /tmp/mfk-dining-r4
          retention-days: 7
