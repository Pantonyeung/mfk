name: Import MoreFun V2 SMT Source

on:
  push:
    branches: [main]
    paths:
      - requests/import-morefun-v2-smt.txt

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout MFK
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read donor source
        id: donor
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sed -n 's/^source_sha=//p' requests/import-morefun-v2-smt.txt | tr -d '[:space:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout MoreFun V2 donor
        uses: actions/checkout@v4
        with:
          repository: Pantonyeung/Morefun-v2
          ref: ${{ steps.donor.outputs.source_sha }}
          path: donor
          fetch-depth: 1
          persist-credentials: false

      - name: Copy SMT source and transitive package dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v2
          mkdir -p v2/apps/smt-clean v2/packages
          cp donor/apps/smt-clean/package.json v2/apps/smt-clean/
          cp donor/apps/smt-clean/tsconfig.json v2/apps/smt-clean/
          cp donor/apps/smt-clean/vite.config.ts v2/apps/smt-clean/
          cp donor/apps/smt-clean/index.html v2/apps/smt-clean/
          if [ -d donor/apps/smt-clean/scripts ]; then cp -a donor/apps/smt-clean/scripts v2/apps/smt-clean/; fi
          cp -a donor/apps/smt-clean/src v2/apps/smt-clean/

          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const donor=path.resolve('donor');
          const target=path.resolve('v2');
          const roots=[path.resolve('donor/apps/smt-clean/src')];
          const seen=new Set();
          const queue=[];

          function files(dir){
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,ent.name);
              if(ent.isDirectory())files(p);
              else if(/\.(?:ts|tsx|js|jsx|mjs|css)$/.test(ent.name))queue.push(p);
            }
          }
          roots.forEach(files);

          function resolveImport(from,spec){
            if(!spec.startsWith('.'))return null;
            const base=path.resolve(path.dirname(from),spec);
            const candidates=[
              base,
              base+'.ts',base+'.tsx',base+'.js',base+'.jsx',base+'.mjs',base+'.css',
              path.join(base,'index.ts'),path.join(base,'index.tsx'),path.join(base,'index.js')
            ];
            return candidates.find(p=>fs.existsSync(p)&&fs.statSync(p).isFile())||null;
          }
          function copyExternal(file){
            const rel=path.relative(donor,file);
            if(rel.startsWith('..'))throw new Error('IMPORT_ESCAPES_DONOR:'+file);
            const dest=path.join(target,rel);
            fs.mkdirSync(path.dirname(dest),{recursive:true});
            if(!fs.existsSync(dest))fs.copyFileSync(file,dest);
          }
          while(queue.length){
            const file=queue.shift();
            if(seen.has(file)||!fs.existsSync(file))continue;
            seen.add(file);
            const src=fs.readFileSync(file,'utf8');
            const specs=[];
            for(const re of [
              /(?:import|export)\s+(?:[^'"]*?\s+from\s+)?['"]([^'"]+)['"]/g,
              /import\(\s*['"]([^'"]+)['"]\s*\)/g
            ]){
              let m; while((m=re.exec(src)))specs.push(m[1]);
            }
            for(const spec of specs){
              const resolved=resolveImport(file,spec);
              if(!resolved)continue;
              if(resolved.startsWith(path.resolve('donor/packages')+path.sep)){
                copyExternal(resolved);
                queue.push(resolved);
              }
            }
          }
          NODE

      - name: Verify imported V2 source can typecheck/build
        working-directory: v2/apps/smt-clean
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Commit clean source snapshot
        shell: bash
        env:
          DONOR_SHA: ${{ steps.donor.outputs.source_sha }}
        run: |
          set -euo pipefail
          rm -rf v2/apps/smt-clean/dist v2/apps/smt-clean/node_modules
          git config user.name "Pantonyeung"
          git config user.email "107616897+Pantonyeung@users.noreply.github.com"
          git add v2
          git diff --cached --quiet && exit 0
          git commit -m "import: MoreFun V2 SMT source $DONOR_SHA"
          git push
