name: admin-ui-refresh-r1-guided-smoke

on:
  pull_request:
    branches:
      - work/MFK/ADMIN-UI-REFRESH-R1
  workflow_dispatch:

jobs:
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
